# go-resample is a library: a release publishes the source archive, a
# checksums file and its keyless cosign signature, plus build provenance
# (attested by the release workflow). See https://goreleaser.com.
version: 2

project_name: go-resample

builds:
  - skip: true

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

checksum:
  name_template: "checksums.txt"

# Sign the checksums file with cosign keyless (Sigstore, OIDC in CI), which
# transitively covers the source archive. Produces checksums.txt.sig and
# checksums.txt.pem, which OpenSSF Scorecard's Signed-Releases check looks
# for. Verification is described in SECURITY.md.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Release notes come from CHANGELOG.md, passed with --release-notes by
# .github/workflows/release.yml. Do not set changelog.disable: it skips the
# step that loads that file, which leaves the release notes empty.
