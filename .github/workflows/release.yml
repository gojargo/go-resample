name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
      id-token: write # OIDC token for keyless cosign signing and provenance
      attestations: write # build provenance for the released artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Test
        run: go test -count=1 ./...
      # The release notes are this version's section of CHANGELOG.md; refuse to
      # release a version that has none.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi
      # cosign, used by GoReleaser's signs step. Pinned to 2.4.x: cosign 2.5+
      # defaults to the bundle format, which deprecates --output-signature and
      # --output-certificate and would stop producing the .sig/.pem assets.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.4.3"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance for everything listed in the checksums file: records
      # which workflow, at which commit, produced the release, so consumers can
      # check it came from this repository. Stored in GitHub's attestation store;
      # see SECURITY.md for verification.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
